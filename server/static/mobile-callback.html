<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squat Overflow sign-in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #0f1214; color: #e8ecef; text-align: center; }
  a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 10px; background: #3ddc97; color: #0f1214; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <p>Signing you in to Squat Overflow…</p>
  <a id="back" href="squatoverflow://auth">Return to Squat Overflow</a>
</main>
<script>
  // Google puts the result in the fragment, which never reaches the server. Hand it to the app
  // as a query string. The target is fixed; only the app holds the raw nonce that redeems the token.
  var target = "squatoverflow://auth?" + location.hash.replace(/^#/, "");
  document.getElementById("back").href = target;
  location.replace(target);
</script>
</body>
</html>
