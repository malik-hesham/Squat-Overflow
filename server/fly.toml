# Fly.io config for the hosted pose server. Deployed by .github/workflows/release.yml
# on every version tag; see docs/deployment.md for the one-time setup.
app = "squat-overflow-pose"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  # Only these extension origins may open the WebSocket (see originAllowed in src/config.ts).
  # The first is the unpacked dev build (from the manifest "key"). Add the Chrome Web Store
  # ID here after the first store upload: "chrome-extension://<dev-id>,chrome-extension://<store-id>".
  FORMCOACH_ALLOWED_ORIGINS = "chrome-extension://lpkaoaegdjhciohkfidnmabjigidofnd"
  # Google sign-in: ID tokens must be issued for this OAuth client (same as extension/config.js).
  # DATABASE_URL and AUTH_JWT_SECRET are Fly secrets; see docs/deployment.md.
  GOOGLE_CLIENT_ID = "977942788346-udafursfj3ns2juas0o7c4knj3pvht3h.apps.googleusercontent.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one Machine warm: the extension gives the server 3 s to answer before it shows "offline".
  min_machines_running = 1

  # Every WebSocket runs its own BlazePose detector, and inference shares one event loop,
  # so cap sessions per Machine.
  # Raise these only after checking latency_ms in frame results under load.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 4
    hard_limit = 6

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
