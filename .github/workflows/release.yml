name: Release

# Push a tag that matches extension/manifest.json "version" to ship everything:
#   git tag v0.4.0 && git push origin v0.4.0
# Order: tests + store zip -> GitHub Release -> Chrome Web Store. The optional API server (sign-in,
# team board, sync) is not deployed from here; run it yourself (docs/deployment.md) and set the
# API_URL variable to it, or leave API_URL unset for a local-only extension.
# One-time setup (variables, secrets, first store upload) is in docs/deployment.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Tag matches manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match extension/manifest.json version $version (expected v$version)"
            exit 1
          fi

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  github-release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-zip
          path: dist
      # A release drafted in the GitHub UI already exists for the tag: attach the zip to it instead.
      - run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip --verify-tag --generate-notes --title "Squat Overflow $TAG" --repo "$GITHUB_REPOSITORY"
          fi

  publish-cws:
    name: Submit to Chrome Web Store
    needs: ci
    # Skipped until the store item exists and CWS_ITEM_ID is set (see docs/deployment.md).
    if: vars.CWS_ITEM_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: extension-zip
          path: dist
      - env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: node scripts/publish-cws.mjs dist/*.zip
