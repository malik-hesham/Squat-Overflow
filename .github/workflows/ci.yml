name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: API server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Jest loads the ESM-only NestJS 12 through require(esm), which needs Node 24.9+.
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  extension:
    name: Extension tests and store zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run typecheck
        working-directory: extension
      - run: node extension/tests/check.mjs
      - run: node --test 'scripts/tests/*.test.mjs'
      # The pose model runs in the extension, so the zip always builds. With the API_URL variable set
      # (https://<your API server>) it also has sign-in, the team board and sync; without, it's local only.
      - env:
          API_URL: ${{ vars.API_URL }}
        run: node scripts/build-extension.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error

  packages:
    name: Digital human packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from packageManager in the root package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck, typed lint, tests and Prettier for packages/, services/ and tools/. The tests
      # include the package boundary check (tools/workspace-check).
      - run: pnpm check

  deploy:
    name: AWS deploy script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # deploy/aws-provision.sh against a fake AWS CLI; also checks nothing upgrades the Free plan.
      - run: node --test 'deploy/tests/*.test.mjs'
      - run: shellcheck deploy/aws-provision.sh deploy/tests/fake-aws/aws

  docker:
    name: API server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg VERSION=ci -t squat-overflow-api server
      - name: Server answers /health and /privacy
        run: |
          docker run -d --name api -p 8080:8080 squat-overflow-api
          for _ in $(seq 1 30); do curl -fsS localhost:8080/health -o health.json && break; sleep 1; done
          node -e "const b = require('./health.json'); if (!b.ok || b.version !== 'ci') throw new Error('version ' + b.version); console.log('api server', b.version)"
          curl -fsS localhost:8080/privacy | grep -q "privacy policy"
      - if: failure()
        run: docker logs api || true

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three systems desktop/ runs on. Windows 10 and 11 use the same build.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Linux libraries (webview, tray, idle time)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libx11-dev libxss-dev
      # The app embeds the extension's files, so they have to be in desktop/web/ before it compiles.
      - run: node desktop/scripts/sync-web.mjs
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - run: cargo build --locked
        working-directory: desktop/src-tauri
