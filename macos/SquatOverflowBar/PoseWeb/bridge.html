<!doctype html>
<meta charset="utf-8">
<title>Squat Overflow pose</title>
<!-- The policy of the extension's own pages (content_security_policy in extension/manifest.json),
     so this page can load and reach only the app's own files. Without it MediaPipe's runtime
     (lib/vendor/mediapipe/vision_bundle.mjs) posts usage statistics to odml.pa.googleapis.com.
     connect-src has no servers: here Swift talks to the API server, not this page. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval'; object-src 'self'; connect-src 'self'">
<!-- Never shown. PoseBridge.swift loads this in a web view to run the extension's pose code. -->
<script type="module" src="bridge.js"></script>
