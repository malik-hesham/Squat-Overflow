<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avatar preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
        background: #e9edf2;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1f24;
          color: #e6e6e6;
        }
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 16px;
        align-items: center;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      output {
        margin-left: auto;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <header>
      <button data-command="idle">Idle</button>
      <button data-command="listen">Listen</button>
      <button data-command="think">Think</button>
      <button data-react="happy">React: happy</button>
      <button data-react="surprised">React: surprised</button>
      <a href="?profile=high">HIGH</a> <a href="?profile=optimized">OPTIMIZED</a>
      <a href="?framing=full">Full body</a> <a href="?framing=portrait">Portrait</a>
      <output id="state">loading…</output>
    </header>
    <canvas id="avatar"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
