# The digital human engine (docs/digital-human/architecture.md). extension/, mobile/, server/
# and vscode-extension/ are not part of this workspace: they keep their own npm lockfiles.
packages:
  - packages/*
  - services/*
  - tools/*

# One version of each tool for every package. TypeScript stays on 6.0 (as in mobile/) until
# typescript-eslint supports 7: TypeScript 7's package has no compiler API.
catalog:
  '@eslint/js': ^10.0.1
  '@react-three/fiber': 9.8.2
  '@gltf-transform/core': ^4.5.1
  '@gltf-transform/extensions': ^4.5.1
  '@gltf-transform/functions': ^4.5.1
  '@types/node': ^24.19.2
  '@types/react': ~19.2.10
  '@types/react-dom': ~19.2.3
  '@vitest/browser-playwright': 5.1.0
  eslint: ^10.14.0
  gltf-validator: 2.0.0-dev.3.10
  meshoptimizer: ^1.3.0
  playwright: 1.65.0
  prettier: ^3.9.10
  react: 19.2.3
  react-dom: 19.2.3
  sharp: ^0.35.5
  turbo: ^2.11.10
  vite: ^8.3.7
  typescript: ~6.0.3
  typescript-eslint: ^8.72.2
  vitest: ^5.1.0
  yaml: ^2.9.1
